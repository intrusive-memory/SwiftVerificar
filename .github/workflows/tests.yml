name: Tests

on:
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate collection
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate collection.json
        run: python3 -c "import json; json.load(open('collection.json'))"

      - name: Verify package URLs are reachable
        run: |
          urls=$(python3 -c "
          import json
          data = json.load(open('collection.json'))
          for p in data.get('packages', []):
              print(p['url'])
          ")
          for url in $urls; do
            repo="${url%.git}"
            echo "Checking $repo..."
            curl -sfL -o /dev/null "$repo" || { echo "FAIL: $repo unreachable"; exit 1; }
          done
          echo "All package URLs reachable."
